name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Node unit tests
        run: pnpm test

      - name: Build website (smoke)
        run: pnpm --filter @d3gl/website build

  # At-scale perf-guard tier (#220): every env-gated node bench, executed with its
  # assertions ON at a reduced-but-real N. Discovery is pattern-driven (any node test
  # reading process.env.BENCH_* — see scripts/run-perf-tier.mjs), so benches added by
  # future PRs are enrolled automatically on merge — no workflow edit needed.
  # Advisory for now (not in branch protection); once it has a flake-free record,
  # promote it by adding "perf" to the required status checks alongside "policy".
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: At-scale perf guards (env-gated benches, asserted)
        run: node scripts/run-perf-tier.mjs
        env:
          PERF_N: "500000"

  # Browser perf-guard tier (#247): every *-perf.browser.test.ts per-frame guard, run
  # headless in Playwright Chromium (SwiftShader software GL on these runners) — the
  # GPU-path regressions the node tier can't see. Discovery is pattern-driven (see
  # scripts/run-browser-perf-tier.mjs), so guards added by future PRs are enrolled
  # automatically on merge — no workflow edit needed. Expected runtime ~5-10 min.
  #
  # BLOCKING as of #262 (was advisory under #247). Promotion evidence: 10 of 11 runs green,
  # and the single red was on the tier's OWN development branch (PR #256, an injected-regression
  # red-run) — 7 consecutive green runs on real branches since, at 79-98s each against a
  # 30-minute job timeout. #257 (wall-clock budget stability) has landed in between.
  # WebGL is the default backend; leaving its only per-frame tier unable to fail the build meant
  # the least-guarded path had the weakest gate.
  # PERF_BUDGET_SCALE multiplies the guards' locally-calibrated wall-clock ceilings and test
  # timeouts for the slower software-GL runners (deterministic allocation/call-count assertions
  # never scale — those stay exact everywhere). PERF_BROWSER_N sets the fixture size.
  # Add "perf-browser" to the required status checks alongside "policy" to complete the promotion.
  perf-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @mapequation/d3gl exec playwright install --with-deps chromium

      - name: Browser perf guards (headless Chromium, software GL)
        run: node scripts/run-browser-perf-tier.mjs
        env:
          # Wall-clock multiplier vs local headless Chromium, calibrated from observed
          # runner timings (2026-07, PR #256: SwiftShader-on-ubuntu measured 1.3-2.5x
          # local across the guards; 4 = worst observed factor + noisy-neighbor
          # margin). Raise if the tier flakes on timing; the deterministic signatures
          # are unaffected either way.
          PERF_BUDGET_SCALE: "4"
          # Fixture size for the guards (#262). Deliberately below the node tier's PERF_N=500000:
          # SwiftShader is software GL, and three independent hard walls sit above this — the
          # 256-wide style GrowTexture (~2.1M rows), one DOM node per drawable in the SVG export
          # legs, and two simultaneously-live charts in the hover guard. Measured locally: the whole
          # tier runs 61s at 100k (vs 51s at the old hardcoded defaults), against a 300s per-file
          # kill. Raise it once the tier has a record at this scale — it is a one-line change, and
          # each guard clamps itself via `perfN(local, { max })`.
          PERF_BROWSER_N: "100000"
