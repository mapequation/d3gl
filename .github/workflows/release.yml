name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The Version Packages PR is opened and pushed as the mapequation release App, not
      # github-actions[bot]: GitHub holds the workflow runs of a PR that bot creates or updates
      # until a maintainer approves them (#472). checkout gets the token too, because git push
      # uses the credentials it persists.
      - name: Create the release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing to npm needs npm >= 11.5.1; Node 22 ships ~10.x.
      # Pinned to 11.x: npm 12 rejects unknown CLI flags (EUNKNOWNCONFIG), and pnpm 9's
      # `pnpm publish` (which `changeset publish` runs) delegates to npm with pnpm's
      # `--no-git-checks`, so publishing 0.10.0 failed under npm@latest (12.x).
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When changesets exist on main, this opens/updates a "Version Packages"
      # PR. When that PR is merged (versions already bumped), it runs `publish`
      # and pushes @mapequation/d3gl to npm via OIDC trusted publishing (no token;
      # uses id-token: write + the package's configured trusted publisher).
      - name: Create Release Pull Request or publish
        uses: changesets/action@v1
        with:
          # `pnpm run …` (not bare `pnpm version`/`pnpm publish`, which are pnpm
          # built-ins) so these invoke our package scripts: `version` →
          # `changeset version`, `release` → build + `changeset publish`.
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
