name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing to npm needs npm >= 11.5.1; Node 22 ships ~10.x.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When changesets exist on main, this opens/updates a "Version Packages"
      # PR. When that PR is merged (versions already bumped), it runs `publish`
      # and pushes @mapequation/d3gl to npm via OIDC trusted publishing (no token;
      # uses id-token: write + the package's configured trusted publisher).
      - name: Create Release Pull Request or publish
        uses: changesets/action@v1
        with:
          # `pnpm run …` (not bare `pnpm version`/`pnpm publish`, which are pnpm
          # built-ins) so these invoke our package scripts: `version` →
          # `changeset version`, `release` → build + `changeset publish`.
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
