name: PR preview

# Each pull request from this repo gets a preview of the website on surge.sh, rebuilt on every push, and a
# comment with its link: https://mapequation-d3gl-preview-pr-<number>.surge.sh/d3gl/ (the job name is part of
# the domain). The preview is torn down when the pull request closes. Pull requests from forks don't get one:
# their runs can't read the SURGE_TOKEN secret.
#
# The site keeps its GitHub Pages base, /d3gl/ (the docs link to /d3gl/… paths), so the build goes into a d3gl/
# folder and the root redirects there. Like GitHub Pages, surge can't send the cross-origin isolation headers,
# so the preview runs the layout worker's postMessage fallback, as the live site does (#163).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

# A newer push replaces a deploy still running; a close tears down after it.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: afc163/surge-preview@v1.13.0
        with:
          surge_token: ${{ secrets.SURGE_TOKEN }}
          dist: preview
          teardown: "true"
          failOnError: "true"
          # Each line runs as one command without a shell: no redirects or pipes.
          build: |
            pnpm install --frozen-lockfile
            pnpm --filter @d3gl/website build
            mkdir -p preview
            cp -R website/dist preview/d3gl
            cp website/dist/404.html preview/404.html
            cp .github/preview/index.html preview/index.html
